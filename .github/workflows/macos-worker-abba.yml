name: macos-worker-abba

on:
  push:
    branches: [dot/macos-worker-abba-20261113]

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 712ba95652e2d08d4487dd08bf6465115a3d7a03
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Check out pinned omp-ulw test fixture
        run: |
          pin="$(tr -d '[:space:]' < omp-ulw.lock)"
          git clone --quiet https://github.com/dbc-hbin/omp-ulw.git ref/omp-ulw
          git -C ref/omp-ulw -c advice.detachedHead=false checkout --quiet "$pin"
          test "$(git -C ref/omp-ulw rev-parse HEAD)" = "$pin"
      - name: Check out exact explicit-override compatibility fixture
        run: |
          pin=cbfe5ee72e5b2783af01616e7f4d3da5e3f9180d
          compat="$RUNNER_TEMP/omp-dori-compat-ulw"
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE/ref/omp-ulw" "$compat"
          git -C "$compat" fetch --quiet --no-tags https://github.com/dbc-hbin/omp-ulw.git "$pin"
          git -C "$compat" -c advice.detachedHead=false checkout --quiet "$pin"
          test "$(git -C "$compat" rev-parse HEAD)" = "$pin"
          printf 'DORI_TEST_COMPAT_ULW_ENTRY=%s/index.ts\n' "$compat" >> "$GITHUB_ENV"
      - name: Install exact native OMP test host
        run: bun install --frozen-lockfile
        working-directory: test/fixtures/omp-native-host
      - name: Bind exact native OMP test host
        run: |
          host="$GITHUB_WORKSPACE/test/fixtures/omp-native-host/node_modules/@oh-my-pi/pi-coding-agent"
          bun -e 'const p = await Bun.file(process.argv[1] + "/package.json").json(); if (p.version !== "18.18.8") throw new Error("unexpected native OMP fixture version: " + p.version)' "$host"
          printf 'DORI_TEST_OMP_ROOT=%s\n' "$host" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: skills/dori-mode/scripts
      - name: Same-machine ABBA root benchmark
        run: |
          python3 - <<'PY'
          import subprocess, time, re, json, os
          results=[]
          for index, workers in enumerate([2,3,3,2], 1):
              start=time.monotonic()
              p=subprocess.run(["bun","test",f"--parallel={workers}","./test/"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              elapsed=time.monotonic()-start
              print(f"=== BENCHMARK {index} WORKERS {workers} ===", flush=True)
              print(p.stdout, flush=True)
              result={"index":index,"workers":workers,"seconds":round(elapsed,3),"exit":p.returncode}
              for kind in ["pass","skip","fail"]:
                  matches=re.findall(r"(\d+) "+kind+r"\b",p.stdout)
                  result[kind]=int(matches[-1]) if matches else None
              results.append(result)
              print("BENCHMARK_RESULT "+json.dumps(result),flush=True)
          print("BENCHMARK_ALL "+json.dumps(results),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(json.dumps(results,indent=2))
          raise SystemExit(1 if any(x["exit"] for x in results) else 0)
          PY
